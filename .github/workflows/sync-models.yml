# Keep the RunPod network volume in sync with the manifest: merging a PR that
# adds a workflow's models is all it takes — this downloads them onto the
# volume via a one-shot job on the same endpoint.
name: Sync models to network volume
on:
  push:
    branches: [main]
    paths: ['manifest/**']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Sync
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/sync_models.py
