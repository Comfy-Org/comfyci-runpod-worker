# Keep the RunPod network volume in sync with the manifest: merging a PR that
# adds a workflow's models is all it takes — this downloads them onto the
# volume via a one-shot job on the primary lane's endpoint (manifest/lanes.json;
# the RUNPOD_ENDPOINT_ID secret is only a fallback when the primary has none).
name: Sync models to network volume
on:
  push:
    branches: [main]
    paths: ['manifest/**']
  workflow_dispatch:

# One writer on the volume at a time: a second sync waits for the first.
concurrency:
  group: sync-models
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Sync
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          # Fallback only: sync_models.py uses the primary lane's endpoint.
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/sync_models.py
