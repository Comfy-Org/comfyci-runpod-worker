# Interim scheduler: poll ComfyUI master and run the GPU regression suite for
# each new commit on every provisioned per-commit lane, publishing results to
# this repo's `results` branch (read by ci.comfy.org via raw.githubusercontent.com).
# Once GCS credentials exist this moves into ComfyUI's own test-ci.yml as a
# per-push job (see action.yml).
name: GPU regression
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: ComfyUI commit sha (empty = master HEAD)
        default: ''
      workflows:
        description: csv of workflow ids, or 'all'
        default: all
      lane:
        description: lane id from manifest/lanes.json (empty = every provisioned per-commit lane)
        default: ''

concurrency:
  group: gpu-regression
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lanes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        env:
          LANE: ${{ inputs.lane }}
        run: |
          cd scripts
          if [ -n "$LANE" ]; then
            matrix=$(python lanes.py per-commit --only "$LANE")
          else
            matrix=$(python lanes.py per-commit)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python -m json.tool

  regression:
    needs: lanes
    if: needs.lanes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.lanes.outputs.matrix) }}
    name: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      # A commit is tested once per lane: any published result (pass, fail or
      # execution_error) ends it, a result with infra errors gets one retry,
      # and a dispatch naming a commit always runs (scripts/regression_skip.py).
      - name: Resolve target commit and skip if already tested on this lane
        id: target
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          PREFIX: ${{ matrix.prefix }}
        run: |
          COMMIT="$INPUT_COMMIT"
          if [ -n "$COMMIT" ] && ! [[ "$COMMIT" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::the commit input must be a 7-40 character hex sha"
            exit 1
          fi
          if [ -z "$COMMIT" ]; then
            COMMIT=$(git ls-remote https://github.com/Comfy-Org/ComfyUI refs/heads/master | cut -f1)
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          # What the lane already published for this commit, read straight from
          # the results branch (raw.githubusercontent.com caches for ~5 min; git does not).
          SUMMARY="$RUNNER_TEMP/published-summary.json"
          LATEST="$RUNNER_TEMP/published-latest.json"
          : > "$SUMMARY"
          : > "$LATEST"
          if git fetch --depth 1 --filter=blob:none origin results 2>/dev/null; then
            RUN_SUMMARY="$PREFIX/runs/master/$COMMIT/summary.json"
            # The trees came with the fetch, so whether the summary exists is
            # known without the network; only its content is fetched lazily.
            if [ -n "$(git ls-tree --name-only FETCH_HEAD -- "$RUN_SUMMARY")" ]; then
              git show "FETCH_HEAD:$RUN_SUMMARY" > "$SUMMARY" 2>/dev/null \
                || git show "FETCH_HEAD:$RUN_SUMMARY" > "$SUMMARY" 2>/dev/null \
                || echo '{"unreadable": true}' > "$SUMMARY"
            fi
            git show "FETCH_HEAD:$PREFIX/latest/master.json" > "$LATEST" 2>/dev/null || : > "$LATEST"
          fi
          args=(--commit "$COMMIT" --summary "$SUMMARY" --latest "$LATEST")
          if [ -n "$INPUT_COMMIT" ]; then args+=(--explicit); fi
          python scripts/regression_skip.py "${args[@]}" >> "$GITHUB_OUTPUT"
      - name: Run regression suite
        if: steps.target.outputs.skip != 'true'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.target.outputs.commit }}
          WORKFLOWS: ${{ inputs.workflows || 'all' }}
          LANE: ${{ matrix.lane }}
        # The summary file is written before the script exits, so the PR
        # comment step below can read it even when this step fails.
        run: |
          python scripts/run_regression.py \
            --commit "$COMMIT" \
            --branch master \
            --lane "$LANE" \
            --workflows "$WORKFLOWS" \
            --workdir "$RUNNER_TEMP/regression-work" \
            --results-workdir "$RUNNER_TEMP/results-checkout" \
            --summary-out "$RUNNER_TEMP/summary.json"
      # PULSE: one comment, updated in place, on the PR that landed the tested
      # commit when its outputs changed; code owners' PRs only, primary lane
      # only. dry-run (the default) only renders it into the job summary. See README.
      - name: PR comment (PULSE)
        if: always() && steps.target.outputs.skip != 'true'
        continue-on-error: true
        env:
          PULSE_PR_COMMENTS: ${{ vars.PULSE_PR_COMMENTS || 'dry-run' }}
          PULSE_GH_TOKEN: ${{ secrets.PULSE_GH_TOKEN }}
          PULSE_ALLOWED_AUTHORS: ${{ vars.PULSE_ALLOWED_AUTHORS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/notify_pr.py --summary "$RUNNER_TEMP/summary.json"
