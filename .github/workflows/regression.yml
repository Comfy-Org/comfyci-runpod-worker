# Interim scheduler: poll ComfyUI master and run the GPU regression suite for
# each new commit on every provisioned per-commit lane.
#
# The results are shown in the run itself: each lane job writes a report to its
# job summary (verdicts, metrics, images, failure detail, recent history) and
# the "All lanes" job puts the lanes side by side (scripts/run_report.py). This
# repo's `results` branch is the permanent store; ci.comfy.org reads the same
# files via raw.githubusercontent.com.
#
# Once GCS credentials exist this moves into ComfyUI's own test-ci.yml as a
# per-push job (see action.yml).
name: GPU regression
on:
  # Every 5 minutes, the shortest interval GitHub schedules (it can start a run
  # late, or drop one, when it is busy). A tick that finds master HEAD already
  # tested costs no GPU time: it only shows the published result again.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: ComfyUI commit sha (empty = master HEAD)
        default: ''
      workflows:
        description: csv of workflow ids, or 'all'
        default: all
      lane:
        description: lane id from manifest/lanes.json (empty = every provisioned per-commit lane; with report_only, every lane, retired ones too)
        default: ''
      report_only:
        description: show the published result of the commit in the run summary without testing it again; starts no GPU job and writes nothing
        type: boolean
        default: false

# A report-only run reads the results branch and nothing else, so it gets a
# group of its own: it neither waits for a real run nor cancels a pending one.
# Only a dispatch can ask for it (a scheduled run has no inputs); the input is a
# boolean in the `inputs` context and the string 'true' in the event payload.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.report_only == true || inputs.report_only == 'true') && format('gpu-regression-report-{0}', github.run_id) || 'gpu-regression' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lanes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      commit: ${{ steps.commit.outputs.commit }}
      short: ${{ steps.commit.outputs.short }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A report-only run tests nothing, so it shows every lane that can hold
      # results: a retired lane and one without an endpoint too (`lanes.py
      # report`). The lane jobs skip the GPU step on the same condition.
      - id: plan
        env:
          LANE: ${{ inputs.lane }}
          REPORT_ONLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.report_only == true || inputs.report_only == 'true') }}
        run: |
          cd scripts
          only=()
          if [ -n "$LANE" ]; then only=(--only "$LANE"); fi
          if [ "$REPORT_ONLY" = "true" ]; then
            matrix=$(python lanes.py report "${only[@]}")
          else
            matrix=$(python lanes.py per-commit "${only[@]}")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python -m json.tool
      # Resolved once, here, so every lane of a run tests the same commit (each
      # lane used to ask for master HEAD itself, and master can move in between).
      - name: Resolve target commit
        id: commit
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT="$INPUT_COMMIT"
          if [ -n "$COMMIT" ] && ! [[ "$COMMIT" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::the commit input must be a 7-40 character hex sha"
            exit 1
          fi
          # Results are stored under the full sha. An abbreviated input is
          # expanded here: a report-only run would otherwise find nothing
          # published, and a test run would publish under the short name.
          if [ -n "$COMMIT" ] && [ "${#COMMIT}" -lt 40 ]; then
            FULL=$(gh api "repos/Comfy-Org/ComfyUI/commits/$COMMIT" --jq .sha) || FULL=""
            if ! [[ "$FULL" =~ ^[0-9a-f]{40}$ ]] || [ "${FULL:0:${#COMMIT}}" != "$COMMIT" ]; then
              echo "::error::could not expand the commit input $COMMIT to a 40 character sha in Comfy-Org/ComfyUI (unknown or ambiguous)"
              exit 1
            fi
            COMMIT="$FULL"
          fi
          if [ -z "$COMMIT" ]; then
            COMMIT=$(git ls-remote https://github.com/Comfy-Org/ComfyUI refs/heads/master | cut -f1) || COMMIT=""
            # Without this check a failed lookup left the commit empty and the run went on.
            if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::could not resolve ComfyUI master HEAD to a 40 character sha (git ls-remote failed or returned nothing)"
              exit 1
            fi
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short=${COMMIT:0:8}" >> "$GITHUB_OUTPUT"
          echo "target commit: $COMMIT"

  regression:
    needs: lanes
    if: needs.lanes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.lanes.outputs.matrix) }}
    name: ${{ matrix.lane }} · ${{ needs.lanes.outputs.short }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A commit is tested once per lane: any published result (pass, fail or
      # execution_error) ends it; a result with infra errors, or a start marker
      # with no result (the run died before publishing), gets one retry; and a
      # dispatch naming a commit always runs (scripts/regression_skip.py).
      # A report-only dispatch tests nothing: it skips without asking.
      - name: Skip if already tested on this lane
        id: target
        env:
          COMMIT: ${{ needs.lanes.outputs.commit }}
          INPUT_COMMIT: ${{ inputs.commit }}
          REPORT_ONLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.report_only == true || inputs.report_only == 'true') }}
          PREFIX: ${{ matrix.prefix }}
        run: |
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          if [ "$REPORT_ONLY" = "true" ]; then
            echo "report only: showing what is published for $COMMIT, nothing is tested" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What the lane already published for this commit, read straight from
          # the results branch (raw.githubusercontent.com caches for ~5 min; git does not).
          SUMMARY="$RUNNER_TEMP/published-summary.json"
          ATTEMPT="$RUNNER_TEMP/published-attempt.json"
          LATEST="$RUNNER_TEMP/published-latest.json"
          : > "$SUMMARY"
          : > "$ATTEMPT"
          : > "$LATEST"
          # The trees come with the fetch, so whether a file exists is known
          # without the network; only its content is fetched lazily.
          read_published() {
            if [ -n "$(git ls-tree --name-only FETCH_HEAD -- "$1")" ]; then
              git show "FETCH_HEAD:$1" > "$2" 2>/dev/null \
                || git show "FETCH_HEAD:$1" > "$2" 2>/dev/null \
                || echo '{"unreadable": true}' > "$2"
            fi
          }
          if git fetch --depth 1 --filter=blob:none origin results 2>/dev/null; then
            RUN_DIR="$PREFIX/runs/master/$COMMIT"
            read_published "$RUN_DIR/summary.json" "$SUMMARY"
            read_published "$RUN_DIR/attempt.json" "$ATTEMPT"
            git show "FETCH_HEAD:$PREFIX/latest/master.json" > "$LATEST" 2>/dev/null || : > "$LATEST"
          fi
          args=(--commit "$COMMIT" --summary "$SUMMARY" --attempt "$ATTEMPT" --latest "$LATEST")
          if [ -n "$INPUT_COMMIT" ]; then args+=(--explicit); fi
          python scripts/regression_skip.py "${args[@]}" >> "$GITHUB_OUTPUT"
      # Only a run that tests needs the packages: the skip check above and the
      # report below use the standard library, and most ticks skip.
      - name: Install the suite's packages
        if: steps.target.outputs.skip != 'true'
        run: pip install -r scripts/requirements.txt
      - name: Run regression suite
        if: steps.target.outputs.skip != 'true'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.target.outputs.commit }}
          WORKFLOWS: ${{ inputs.workflows || 'all' }}
          LANE: ${{ matrix.lane }}
        # The summary file is written before the script exits, so the report
        # and PR comment steps below can read it even when this step fails.
        run: |
          python scripts/run_regression.py \
            --commit "$COMMIT" \
            --branch master \
            --lane "$LANE" \
            --workflows "$WORKFLOWS" \
            --workdir "$RUNNER_TEMP/regression-work" \
            --results-workdir "$RUNNER_TEMP/results-checkout" \
            --summary-out "$RUNNER_TEMP/summary.json"
      # The run's own files (run.json, comparison.json, outputs, figures and the
      # summary), attached to the run: the copy to download, and the only one
      # when the publish to the results branch failed. GitHub keeps it 90 days.
      # overwrite: a re-run of the job replaces the files of its first attempt
      # (an artifact name can be used once per run otherwise).
      - name: Attach the run's files
        id: upload
        if: always() && steps.target.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gpu-regression-${{ matrix.lane }}-${{ needs.lanes.outputs.short }}
          path: |
            ${{ runner.temp }}/regression-work
            ${{ runner.temp }}/summary.json
          if-no-files-found: ignore
          overwrite: true
      # The lane's report, first in the job summary. It always runs: after a
      # test, after a failed test, and on a skipped commit (where it shows the
      # result that is already published). It never fails the job. It gets ten
      # minutes: a report that hangs would hold the run, and with it the group
      # that every later commit waits in.
      - name: Report
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        env:
          COMMIT: ${{ needs.lanes.outputs.commit }}
          LANE: ${{ matrix.lane }}
          SKIPPED: ${{ steps.target.outputs.skip }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          args=(lane --commit "$COMMIT" --branch master --lane "$LANE"
                --summary "$RUNNER_TEMP/summary.json"
                --workdir "$RUNNER_TEMP/regression-work")
          if [ "$SKIPPED" = "true" ]; then args+=(--skipped); fi
          if [ -n "$ARTIFACT_URL" ]; then args+=(--artifact-url "$ARTIFACT_URL"); fi
          python scripts/run_report.py "${args[@]}"
      # PULSE: one comment, updated in place, on the PR that landed the tested
      # commit when its outputs changed; code owners' PRs only, primary lane
      # only. dry-run (the default) only renders it into the job summary. See README.
      - name: PR comment (PULSE)
        if: always() && steps.target.outputs.skip != 'true'
        continue-on-error: true
        env:
          PULSE_PR_COMMENTS: ${{ vars.PULSE_PR_COMMENTS || 'dry-run' }}
          PULSE_GH_TOKEN: ${{ secrets.PULSE_GH_TOKEN }}
          PULSE_ALLOWED_AUTHORS: ${{ vars.PULSE_ALLOWED_AUTHORS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/notify_pr.py --summary "$RUNNER_TEMP/summary.json"

  # Every lane side by side, for this commit and for recent ones. It reads the
  # results branch after the lanes are done and writes nothing.
  overview:
    needs: [lanes, regression]
    if: always() && needs.lanes.result == 'success' && needs.lanes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: All lanes · ${{ needs.lanes.outputs.short }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report
        continue-on-error: true
        timeout-minutes: 10
        env:
          COMMIT: ${{ needs.lanes.outputs.commit }}
        run: python scripts/run_report.py overview --commit "$COMMIT" --branch master
