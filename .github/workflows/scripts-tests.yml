# Unit tests for the CPU-side orchestration scripts (no RunPod, no network),
# the manifest lint that checks every workflow against its model list, and the
# worker's own code under src/: the custom-node pack module (install
# bookkeeping and log parsing), the model fetch of a job against a local HTTP
# server, the handler's answer and the prompt validation. Two tests read the
# Dockerfile, so a change to it runs them too.
# The two GPU regression workflow files are on the list because the tests hold
# the steps they share to the same text: an edit of one alone must run them.
name: Script tests
on:
  pull_request:
    paths: ['scripts/**', 'src/**', 'Dockerfile', 'manifest/**', 'docker/extra_model_paths.yaml', '.github/workflows/scripts-tests.yml', '.github/workflows/regression.yml', '.github/workflows/nightly-weekly.yml']
  push:
    branches: [main]
    paths: ['scripts/**', 'src/**', 'Dockerfile', 'manifest/**', 'docker/extra_model_paths.yaml', '.github/workflows/scripts-tests.yml', '.github/workflows/regression.yml', '.github/workflows/nightly-weekly.yml']

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # 3.12 is what the runner scripts run on. 3.13 is the Python of the worker
    # images (PYTHON_VERSION in the Dockerfile), where the code under src/ runs.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    name: pytest (${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r scripts/requirements.txt pytest
      - run: python -m pytest scripts/tests -q
