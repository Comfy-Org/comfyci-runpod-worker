# Generate golden baselines at a release tag (two runs per workflow: outputs +
# determinism noise floor), then optionally bless them as the active baseline.
# Recommended flow: run with bless=false, inspect on ci.comfy.org, re-run with
# bless_only=true. To accept an intentional numerics change without GPU time,
# promote the outputs of an existing run: from_run=master/<sha>, workflows=<id>,
# reason="...", bless=true (see README, "Accepting an intentional change").
name: Golden baselines
on:
  workflow_dispatch:
    inputs:
      ref:
        description: ComfyUI release tag, branch, or full commit sha to generate goldens from (optional with from_run)
        default: ''
      workflows:
        description: csv of workflow ids, or 'all'
        default: all
      bless:
        description: bless immediately after generating
        type: boolean
        default: false
      bless_only:
        description: skip generation; just point current.json at ref
        type: boolean
        default: false
      from_run:
        description: promote an existing run's outputs instead of running (BRANCH/<full sha>)
        default: ''
      reason:
        description: why this baseline is being (re)blessed (stored in blessed.json/current.json)
        default: ''
      lane:
        description: lane id from manifest/lanes.json (empty = lane of the default prefix)
        default: ''
      force:
        description: overwrite an existing golden/<workflow>/<tag>/
        type: boolean
        default: false

# Blesses serialise among themselves; the publish retry handles overlap with
# the regression cron (goldens are regenerated as derived writers).
concurrency:
  group: golden-baseline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Generate / bless goldens
        # Inputs reach the script through the environment, never through
        # expression interpolation into the shell: a reason like
        # 'accept "adaln" drift ($100)' must be recorded verbatim.
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          WORKFLOWS: ${{ inputs.workflows }}
          BLESS: ${{ inputs.bless }}
          BLESS_ONLY: ${{ inputs.bless_only }}
          FROM_RUN: ${{ inputs.from_run }}
          REASON: ${{ inputs.reason }}
          LANE: ${{ inputs.lane }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--workflows "$WORKFLOWS"
                --workdir "$RUNNER_TEMP/golden-work"
                --results-workdir "$RUNNER_TEMP/results-checkout")
          if [ -n "$REF" ]; then args+=(--ref "$REF"); fi
          if [ "$BLESS" = "true" ]; then args+=(--bless); fi
          if [ "$BLESS_ONLY" = "true" ]; then args+=(--bless-only); fi
          if [ -n "$FROM_RUN" ]; then args+=(--from-run "$FROM_RUN"); fi
          if [ -n "$REASON" ]; then args+=(--reason "$REASON"); fi
          if [ -n "$LANE" ]; then args+=(--lane "$LANE"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python scripts/golden_baseline.py "${args[@]}"
