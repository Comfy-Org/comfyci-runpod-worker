# Build and push one worker image per torch build declared under `images` in
# manifest/lanes.json, tagged :<image> and :<image>-<sha>, then point the lanes
# that run the image at the new sha tag (RunPod caches a moving tag, so endpoints
# are always pinned to a sha). Uses the workflow's GITHUB_TOKEN for GHCR.
# NOTE: a torch/CUDA change in an image shifts the determinism noise floor —
# regenerate and re-bless that lane's goldens (golden-baseline.yml) after any
# such rebuild. A custom-node pin bump (manifest/custom_nodes.json) rebuilds too;
# re-bless the pack workflows afterwards.
name: Build worker images
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - 'src/**'
      - 'docker/**'
      - manifest/lanes.json
      - manifest/custom_nodes.json
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      images:
        description: csv of image ids from manifest/lanes.json (empty = every buildable image)
        default: ''
      repoint:
        description: point the lanes running each built image at the new tag
        type: boolean
        default: true

jobs:
  plan:
    runs-on: ubuntu-latest
    # `actions: read` lets the plan ask for this workflow's earlier runs.
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A push builds only the images that changed (`lanes.py images --since`): a
      # change to the Dockerfile, src/, docker/ or the pack registry builds them
      # all, a change to lanes.json only the images whose entry differs. Adding
      # a lane or writing an endpoint id builds nothing and repoints nothing.
      # The comparison is with the commit the images were last built from: the
      # head of the last push run of this workflow on main that succeeded. So
      # a build that failed is made up for by the next push that starts this
      # workflow, whatever that push changes. When no such run is known, the
      # commit before the push stands in (not HEAD~1: a push can hold several
      # commits). A checkout holds only HEAD, so the commit is fetched first.
      # When it is all zeros (a new branch) or cannot be fetched (a forced
      # push), every image is built.
      - id: plan
        env:
          IMAGES: ${{ inputs.images }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd scripts
          if [ -n "$IMAGES" ]; then
            matrix=$(python lanes.py images --only "$IMAGES")
          elif [ "$EVENT" = "push" ]; then
            built=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-image.yml \
              --branch main --event push --status success --limit 1 \
              --json headSha --jq '.[0].headSha // empty' || true)
            since="${built:-$BEFORE}"
            git fetch --quiet --no-tags --depth=1 origin "$since" || true
            matrix=$(python lanes.py images --since "$since")
          else
            matrix=$(python lanes.py images)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python -m json.tool

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space (torch layers are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            IMAGE_ID=${{ matrix.image }}
            PYTHON_VERSION=${{ matrix.python }}
            CUDA_VERSION=${{ matrix.cuda }}
            TORCH_INDEX=${{ matrix.torch_index }}
            TORCH_SPEC=${{ matrix.torch_spec }}
            IMAGE_SHA=${{ github.sha }}
          tags: |
            ghcr.io/comfy-org/comfyci-runpod-worker:${{ matrix.image }}
            ghcr.io/comfy-org/comfyci-runpod-worker:${{ matrix.image }}-${{ github.sha }}
          # One cache per image in the registry: the 10 GB Actions cache cannot
          # hold several torch builds.
          cache-from: type=registry,ref=ghcr.io/comfy-org/comfyci-runpod-worker:buildcache-${{ matrix.image }}
          cache-to: type=registry,ref=ghcr.io/comfy-org/comfyci-runpod-worker:buildcache-${{ matrix.image }},mode=max
      - uses: actions/setup-python@v5
        if: github.event_name == 'push' || inputs.repoint
        with:
          python-version: '3.12'
      - name: Point lanes at the new image
        if: github.event_name == 'push' || inputs.repoint
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.image }}-${{ github.sha }}
        run: |
          pip install -r scripts/requirements.txt
          cd scripts
          python runpod_endpoints.py set-image --image "$IMAGE" --tag "$TAG"
