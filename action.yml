name: ComfyCI RunPod Regression
description: >
  Run the curated workflow manifest for a ComfyUI commit on RunPod serverless
  GPUs, compare outputs against golden + previous-run baselines, and publish
  results for ci.comfy.org.
inputs:
  comfy-commit:
    description: ComfyUI commit sha to test
    required: true
  branch:
    description: Branch name for results pathing and the previous-run pointer
    required: true
  storage:
    description: >
      Results backend: 'gcs' (needs GCS_SERVICE_ACCOUNT_JSON env + gcs-bucket)
      or 'github' (needs a GITHUB_TOKEN env that can push to the results repo —
      note the default workflow token cannot push across repos).
    required: false
    default: gcs
  gcs-bucket:
    description: GCS bucket that holds regression results (gcs storage only)
    required: false
    default: ''
  workflows:
    description: csv of workflow ids to run, or 'all' (enabled ones)
    required: false
    default: all
  repo-url:
    description: ComfyUI repo url override (forks / PR testing)
    required: false
    default: ''
  lane:
    description: >
      Lane id from manifest/lanes.json to run on (normally its `primary`).
      Empty means the lane of the default `regression` prefix, which is retired,
      so the run would be refused.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check out worker repo (manifest + scripts)
      uses: actions/checkout@v4
      with:
        repository: comfy-org/comfyci-runpod-worker
        path: comfyci-runpod-worker
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      shell: bash
      run: pip install -r comfyci-runpod-worker/scripts/requirements.txt
    - name: Write GCS credentials
      if: inputs.storage == 'gcs'
      shell: bash
      run: |
        echo "$GCS_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcs-sa.json"
        echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcs-sa.json" >> "$GITHUB_ENV"
    - name: Run regression suite
      shell: bash
      run: |
        python comfyci-runpod-worker/scripts/run_regression.py \
          --commit "${{ inputs.comfy-commit }}" \
          --branch "${{ inputs.branch }}" \
          --storage "${{ inputs.storage }}" \
          --workflows "${{ inputs.workflows }}" \
          --results-workdir "$RUNNER_TEMP/results-checkout" \
          --summary-out "$RUNNER_TEMP/summary.json" \
          ${{ inputs.gcs-bucket != '' && format('--bucket {0}', inputs.gcs-bucket) || '' }} \
          ${{ inputs.repo-url != '' && format('--repo-url {0}', inputs.repo-url) || '' }} \
          ${{ inputs.lane != '' && format('--lane {0}', inputs.lane) || '' }}
    # The lane's report in the job summary (scripts/run_report.py). With github
    # storage it reads the results checkout the suite just pushed from; with gcs
    # there is none, and it reports from the summary and run records on the runner.
    # The action runs in its caller's repository, so the report is told where
    # golden-baseline.yml and the image builds live: the repository checked out above.
    - name: Report
      if: always() && inputs.lane != ''
      continue-on-error: true
      shell: bash
      env:
        REPORT_COMMIT: ${{ inputs.comfy-commit }}
        REPORT_BRANCH: ${{ inputs.branch }}
        REPORT_LANE: ${{ inputs.lane }}
        REPORT_WORKER_REPO: comfy-org/comfyci-runpod-worker
      run: |
        python comfyci-runpod-worker/scripts/run_report.py lane \
          --commit "$REPORT_COMMIT" --branch "$REPORT_BRANCH" --lane "$REPORT_LANE" \
          --summary "$RUNNER_TEMP/summary.json" --workdir regression-work \
          --results-dir "$RUNNER_TEMP/results-checkout" --no-fetch
